<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARISE - Status</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #050816;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      color: #00d4ff;
      gap: 1.5rem;
      padding: 2rem;
    }
    .system-text {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      letter-spacing: 0.2em;
      text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
    }
    .status-card {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid #00d4ff;
      border-radius: 8px;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #00d4ff;
      margin-bottom: 1rem;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }
    .hunter-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
    }
    .logout-btn {
      background: transparent;
      border: 2px solid #ff4444;
      color: #ff4444;
      padding: 0.75rem 1.5rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 5px #ff4444;
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
    }
    .logout-btn:hover {
      background: #ff4444;
      color: #050816;
      box-shadow: 0 0 30px rgba(255, 68, 68, 0.6);
      text-shadow: none;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 212, 255, 0.03),
        rgba(0, 212, 255, 0.03) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div class="system-text">[SYSTEM] ONLINE</div>
  <div id="content" class="loading">
    <div class="system-text" style="font-size: 1rem;">LOADING HUNTER DATA...</div>
  </div>

  <script>
    async function loadHunter() {
      try {
        const res = await fetch('/api/me');
        if (res.status === 401) {
          window.location.href = '/';
          return;
        }
        const data = await res.json();
        document.getElementById('content').innerHTML = `
          <div class="status-card">
            <img src="${data.avatar}" alt="${data.name}" class="avatar" onerror="this.style.display='none'">
            <div class="hunter-name">Welcome, Hunter ${data.name}</div>
            <button class="logout-btn" onclick="logout()">[ LOGOUT ]</button>
          </div>
        `;
      } catch (err) {
        console.error(err);
        window.location.href = '/';
      }
    }

    async function logout() {
      try {
        await fetch('/auth/logout', { method: 'POST' });
        window.location.href = '/';
      } catch (err) {
        console.error(err);
      }
    }

    loadHunter();
  </script>
</body>
</html>
